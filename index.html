    <script>
      // apply the saved edition before first paint — no flash of the wrong theme
      try {
        var raw = localStorage.getItem('st.edition.tokens'); var v = raw && JSON.parse(raw);
        if (v && v.tokens) {
          var r = document.documentElement;
          for (var k in v.tokens) r.style.setProperty(k, v.tokens[k]);
          r.dataset.edition = v.id; r.style.colorScheme = v.tokens['--scheme'] || 'dark';
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', v.tokens['--bg']);
        }
      } catch (e) {}
    </script>
